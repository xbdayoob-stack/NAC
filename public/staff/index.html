<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff — Order QR</title>
  <style>
    :root {
      --bg: #1c1410;
      --card: #2a211c;
      --accent: #c87941;
      --text: #f5efe8;
      --muted: #a89888;
      --border: #3d3229;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem;
    }
    .wrap { max-width: 24rem; margin: 0 auto; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 1.25rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
    input {
      width: 100%;
      padding: .65rem .75rem;
      border-radius: .5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-bottom: .85rem;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: .75rem;
      border: none;
      border-radius: .5rem;
      background: var(--accent);
      color: #1a1008;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: .5rem;
    }
    .card {
      background: var(--card);
      border-radius: .75rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }
    .hidden { display: none !important; }
    .error { color: #f87171; font-size: .875rem; margin-top: .5rem; }
    .qr-wrap {
      text-align: center;
      padding: .75rem 0;
    }
    .qr-wrap img {
      max-width: 100%;
      border-radius: .5rem;
      background: #fff;
      padding: .5rem;
    }
    .order-num {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin: .5rem 0;
    }
    .link {
      display: block;
      text-align: center;
      color: var(--accent);
      font-size: .85rem;
      word-break: break-all;
    }
    .hint { font-size: .8rem; color: var(--muted); margin-top: 1rem; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>☕ Staff — test QR</h1>

    <div id="panel-login" class="card">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" value="barista@demo.local">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" value="password123">
      <button type="button" id="btn-login">Sign in</button>
      <p id="login-error" class="error hidden"></p>
    </div>

    <div id="panel-queue" class="hidden">
      <div class="card">
        <p style="margin:0 0 1rem; color: var(--muted); font-size: .9rem;">
          Signed in as <span id="user-email"></span>
        </p>
        <button type="button" id="btn-order">Create test order &amp; QR</button>
        <button type="button" id="btn-logout" class="secondary">Sign out</button>
        <p id="order-error" class="error hidden"></p>
      </div>

      <div id="panel-qr" class="card hidden">
        <div class="order-num" id="display-number"></div>
        <div class="qr-wrap">
          <img id="qr-img" alt="Order QR code" width="280" height="280">
        </div>
        <a class="link" id="qr-link" href="#" target="_blank" rel="noopener">Open customer status page</a>
        <p class="hint">Scan with a phone to open the status page or App Clip. Print this screen for counter testing.</p>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "nac_staff_access";

    const $ = (id) => document.getElementById(id);
    const panels = {
      login: $("panel-login"),
      queue: $("panel-queue"),
      qr: $("panel-qr"),
    };

    function apiBase() {
      return window.location.origin;
    }

    function getToken() {
      return sessionStorage.getItem(STORAGE_KEY);
    }

    function setToken(token) {
      if (token) sessionStorage.setItem(STORAGE_KEY, token);
      else sessionStorage.removeItem(STORAGE_KEY);
    }

    function showError(el, msg) {
      el.textContent = msg || "";
      el.classList.toggle("hidden", !msg);
    }

    function setLoggedIn(loggedIn) {
      panels.login.classList.toggle("hidden", loggedIn);
      panels.queue.classList.toggle("hidden", !loggedIn);
      if (!loggedIn) {
        panels.qr.classList.add("hidden");
        setToken(null);
      }
    }

    async function login() {
      showError($("login-error"), "");
      $("btn-login").disabled = true;
      try {
        const res = await fetch(apiBase() + "/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: $("email").value.trim(),
            password: $("password").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || "Login failed");
        }
        setToken(data.accessToken);
        $("user-email").textContent = $("email").value.trim();
        setLoggedIn(true);
      } catch (e) {
        showError($("login-error"), e.message || "Login failed");
      } finally {
        $("btn-login").disabled = false;
      }
    }

    async function createOrder() {
      showError($("order-error"), "");
      const token = getToken();
      if (!token) {
        setLoggedIn(false);
        return;
      }
      $("btn-order").disabled = true;
      try {
        const res = await fetch(apiBase() + "/v1/staff/orders", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({
            items: [
              { name: "Test Latte", quantity: 1 },
              { name: "Croissant", quantity: 1 },
            ],
            etaMinutes: 5,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          setLoggedIn(false);
          throw new Error("Session expired — sign in again");
        }
        if (!res.ok) {
          throw new Error(typeof data.error === "string" ? data.error : "Could not create order");
        }
        $("display-number").textContent = data.orderNumber;
        $("qr-img").src = "data:image/png;base64," + data.qrPngBase64;
        $("qr-link").href = data.qrUrl;
        $("qr-link").textContent = data.qrUrl;
        panels.qr.classList.remove("hidden");
      } catch (e) {
        showError($("order-error"), e.message || "Order failed");
      } finally {
        $("btn-order").disabled = false;
      }
    }

    $("btn-login").addEventListener("click", login);
    $("btn-order").addEventListener("click", createOrder);
    $("btn-logout").addEventListener("click", () => setLoggedIn(false));

    if (getToken()) {
      $("user-email").textContent = $("email").value;
      setLoggedIn(true);
    }
  </script>
</body>
</html>
