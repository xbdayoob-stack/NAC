<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff — Order QR</title>
  <style>
    :root {
      --bg: #1c1410;
      --card: #2a211c;
      --accent: #c87941;
      --text: #f5efe8;
      --muted: #a89888;
      --border: #3d3229;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem;
    }
    .wrap { max-width: 24rem; margin: 0 auto; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 1.25rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
    input, select {
      width: 100%;
      padding: .65rem .75rem;
      border-radius: .5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-bottom: .85rem;
      font-size: 1rem;
    }
    select { cursor: pointer; }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 4.5rem;
      gap: .5rem;
      align-items: end;
      margin-bottom: .5rem;
    }
    .row-2 input { margin-bottom: 0; }
    .item-row .row-2 { grid-template-columns: 1fr 4rem auto; }
    .btn-icon {
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border-radius: .5rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      margin-bottom: .85rem;
    }
    .btn-inline {
      width: auto;
      padding: .45rem .85rem;
      font-size: .85rem;
      font-weight: 500;
      margin-top: 0;
      margin-bottom: .85rem;
    }
    .section-title {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 0 0 .75rem;
    }
    .meta {
      font-size: .8rem;
      color: var(--muted);
      text-align: center;
      word-break: break-all;
      margin: .5rem 0 0;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
    }
    .btn-row button { margin-top: 0; }
    button {
      width: 100%;
      padding: .75rem;
      border: none;
      border-radius: .5rem;
      background: var(--accent);
      color: #1a1008;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: .5rem;
    }
    .card {
      background: var(--card);
      border-radius: .75rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }
    .hidden { display: none !important; }
    .error { color: #f87171; font-size: .875rem; margin-top: .5rem; }
    .qr-wrap {
      text-align: center;
      padding: .75rem 0;
    }
    .qr-wrap img {
      max-width: 100%;
      border-radius: .5rem;
      background: #fff;
      padding: .5rem;
    }
    .order-num {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin: .5rem 0;
    }
    .link {
      display: block;
      text-align: center;
      color: var(--accent);
      font-size: .85rem;
      word-break: break-all;
    }
    .hint { font-size: .8rem; color: var(--muted); margin-top: 1rem; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>☕ Staff — test QR</h1>

    <div id="panel-login" class="card">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" value="barista@demo.local">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" value="password123">
      <button type="button" id="btn-login">Sign in</button>
      <p id="login-error" class="error hidden"></p>
    </div>

    <div id="panel-queue" class="hidden">
      <div class="card">
        <p style="margin:0 0 1rem; color: var(--muted); font-size: .9rem;">
          Signed in as <span id="user-email"></span>
        </p>

        <p class="section-title">Custom order (App Clip / QR test)</p>

        <label for="eta-minutes">ETA (minutes)</label>
        <input id="eta-minutes" type="number" min="0" step="1" value="8" inputmode="numeric">

        <label for="order-status">Status shown when customer opens link</label>
        <select id="order-status">
          <option value="received">Received</option>
          <option value="preparing" selected>Preparing</option>
          <option value="ready">Ready</option>
        </select>

        <label>Line items</label>
        <div id="items-list"></div>
        <button type="button" id="btn-add-item" class="secondary btn-inline">+ Add item</button>

        <div class="btn-row">
          <button type="button" id="btn-order">Create &amp; show QR</button>
          <button type="button" id="btn-quick" class="secondary">Quick demo</button>
        </div>
        <button type="button" id="btn-logout" class="secondary">Sign out</button>
        <p id="order-error" class="error hidden"></p>
      </div>

      <div id="panel-qr" class="card hidden">
        <div class="order-num" id="display-number"></div>
        <p class="meta">Order ID: <span id="display-id"></span></p>
        <div class="qr-wrap">
          <img id="qr-img" alt="Order QR code" width="280" height="280">
        </div>
        <a class="link" id="qr-link" href="#" target="_blank" rel="noopener">Open customer status page</a>
        <button type="button" id="btn-copy-url" class="secondary btn-inline" style="display:block;margin:.75rem auto 0;">Copy App Clip URL</button>
        <p class="hint">Each new order gets a unique <code>/o/&lt;id&gt;</code> URL encoded in the QR. Scan with an iPhone to invoke the App Clip or open the mobile status page.</p>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "nac_staff_access";

    const $ = (id) => document.getElementById(id);
    const panels = {
      login: $("panel-login"),
      queue: $("panel-queue"),
      qr: $("panel-qr"),
    };

    function apiBase() {
      return window.location.origin;
    }

    function getToken() {
      return sessionStorage.getItem(STORAGE_KEY);
    }

    function setToken(token) {
      if (token) sessionStorage.setItem(STORAGE_KEY, token);
      else sessionStorage.removeItem(STORAGE_KEY);
    }

    function showError(el, msg) {
      el.textContent = msg || "";
      el.classList.toggle("hidden", !msg);
    }

    function setLoggedIn(loggedIn) {
      panels.login.classList.toggle("hidden", loggedIn);
      panels.queue.classList.toggle("hidden", !loggedIn);
      if (!loggedIn) {
        panels.qr.classList.add("hidden");
        setToken(null);
      }
    }

    async function login() {
      showError($("login-error"), "");
      $("btn-login").disabled = true;
      try {
        const res = await fetch(apiBase() + "/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: $("email").value.trim(),
            password: $("password").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || "Login failed");
        }
        setToken(data.accessToken);
        $("user-email").textContent = $("email").value.trim();
        setLoggedIn(true);
      } catch (e) {
        showError($("login-error"), e.message || "Login failed");
      } finally {
        $("btn-login").disabled = false;
      }
    }

    function parseItemsFromForm() {
      const rows = document.querySelectorAll("#items-list .item-row");
      const items = [];
      for (const row of rows) {
        const name = row.querySelector("[data-field=name]").value.trim();
        const qty = parseInt(row.querySelector("[data-field=qty]").value, 10);
        const modRaw = row.querySelector("[data-field=mods]")?.value.trim();
        if (!name) continue;
        if (!Number.isFinite(qty) || qty < 1) {
          throw new Error("Each item needs a quantity of at least 1");
        }
        const item = { name, quantity: qty };
        if (modRaw) {
          item.modifiers = modRaw.split(",").map((s) => s.trim()).filter(Boolean);
        }
        items.push(item);
      }
      if (items.length === 0) {
        throw new Error("Add at least one line item");
      }
      return items;
    }

    function addItemRow(preset) {
      const wrap = document.createElement("div");
      wrap.className = "item-row";
      wrap.innerHTML = `
        <div class="row-2">
          <div>
            <input data-field="name" type="text" placeholder="Item name" value="${preset?.name ?? ""}">
          </div>
          <input data-field="qty" type="number" min="1" step="1" value="${preset?.quantity ?? 1}" inputmode="numeric">
          <button type="button" class="btn-icon" title="Remove" aria-label="Remove item">×</button>
        </div>
        <input data-field="mods" type="text" placeholder="Modifiers (optional, comma-separated)">
      `;
      const name = preset?.name ?? "";
      if (preset?.modifiers?.length) {
        wrap.querySelector("[data-field=mods]").value = preset.modifiers.join(", ");
      }
      wrap.querySelector("[data-field=name]").value = name;
      wrap.querySelector(".btn-icon").addEventListener("click", () => {
        if (document.querySelectorAll("#items-list .item-row").length > 1) {
          wrap.remove();
        }
      });
      $("items-list").appendChild(wrap);
    }

    const STATUS_PATH = ["received", "preparing", "ready"];

    async function advanceStatus(orderId, token, target) {
      const startIdx = 0;
      const endIdx = STATUS_PATH.indexOf(target);
      if (endIdx < 0) return;
      for (let i = startIdx + 1; i <= endIdx; i++) {
        const status = STATUS_PATH[i];
        const res = await fetch(apiBase() + "/v1/staff/orders/" + orderId + "/status", {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({ status }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || "Could not set status to " + status);
        }
      }
    }

    function showQrResult(data) {
      $("display-number").textContent = data.orderNumber;
      $("display-id").textContent = data.orderId;
      $("qr-img").src = "data:image/png;base64," + data.qrPngBase64;
      $("qr-link").href = data.qrUrl;
      $("qr-link").textContent = data.qrUrl;
      panels.qr.classList.remove("hidden");
      panels.qr.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    async function createOrder(opts) {
      showError($("order-error"), "");
      const token = getToken();
      if (!token) {
        setLoggedIn(false);
        return;
      }
      const busy = [$("btn-order"), $("btn-quick")];
      busy.forEach((b) => { b.disabled = true; });
      try {
        const items = opts?.items ?? parseItemsFromForm();
        const etaRaw = $("eta-minutes").value;
        const etaMinutes = etaRaw === "" ? undefined : parseInt(etaRaw, 10);
        if (etaMinutes !== undefined && (!Number.isFinite(etaMinutes) || etaMinutes < 0)) {
          throw new Error("ETA must be zero or a positive number");
        }
        const targetStatus = $("order-status").value;

        const res = await fetch(apiBase() + "/v1/staff/orders", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({
            items,
            ...(etaMinutes !== undefined ? { etaMinutes } : {}),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          setLoggedIn(false);
          throw new Error("Session expired — sign in again");
        }
        if (!res.ok) {
          throw new Error(typeof data.error === "string" ? data.error : "Could not create order");
        }

        if (targetStatus !== "received") {
          await advanceStatus(data.orderId, token, targetStatus);
        }

        showQrResult(data);
      } catch (e) {
        showError($("order-error"), e.message || "Order failed");
      } finally {
        busy.forEach((b) => { b.disabled = false; });
      }
    }

    function fillQuickDemo() {
      $("items-list").innerHTML = "";
      addItemRow({ name: "Test Latte", quantity: 1, modifiers: ["Oat milk"] });
      addItemRow({ name: "Croissant", quantity: 2 });
      $("eta-minutes").value = "5";
      $("order-status").value = "preparing";
    }

    $("btn-login").addEventListener("click", login);
    $("btn-order").addEventListener("click", () => createOrder());
    $("btn-quick").addEventListener("click", () => {
      fillQuickDemo();
      createOrder({
        items: [
          { name: "Test Latte", quantity: 1, modifiers: ["Oat milk"] },
          { name: "Croissant", quantity: 2 },
        ],
      });
    });
    $("btn-add-item").addEventListener("click", () => addItemRow());
    $("btn-logout").addEventListener("click", () => setLoggedIn(false));
    $("btn-copy-url").addEventListener("click", async () => {
      const url = $("qr-link").href;
      try {
        await navigator.clipboard.writeText(url);
        $("btn-copy-url").textContent = "Copied!";
        setTimeout(() => { $("btn-copy-url").textContent = "Copy App Clip URL"; }, 2000);
      } catch {
        window.prompt("Copy this URL:", url);
      }
    });

    addItemRow({ name: "Custom drink", quantity: 1 });

    if (getToken()) {
      $("user-email").textContent = $("email").value;
      setLoggedIn(true);
    }
  </script>
</body>
</html>
